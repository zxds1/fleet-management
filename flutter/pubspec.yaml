name: helix
description: "Helix — fleet operations field app (driver + admin shells)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # networking
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # maps. flutter_map is pure Dart and needs no API key: the OpenStreetMap
  # tiles work out of the box, and a keyed tile provider can be swapped in at
  # build time with MAP_TILE_URL. The Google Maps SDK this replaced hard-
  # required a key and rendered a blank grey tile without one.
  flutter_map: ^8.3.2
  latlong2: ^0.9.1

  # storage
  sqflite: ^2.3.3+2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # device
  camera: ^0.11.0+2
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  screen_protector: ^1.4.0+1
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.4
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4

  # utils
  image: ^4.5.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

  intl: any
  path: any
  file_picker: ^11.0.3
  app_links: ^7.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/pins/
    - assets/brand/

  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
