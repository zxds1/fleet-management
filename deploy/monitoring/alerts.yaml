# deploy/monitoring/alerts.yaml
# CloudWatch metric alarms + SNS topic for Fleet Management Platform (af-south-1).
# These correspond to the SLOs in docs/backend/slo.md and the Grafana dashboard
# in deploy/monitoring/grafana-dashboards.json. Prometheus metrics are scraped via
# the Prometheus Server / Grafana Cloud integration; CloudWatch alarms cover the
# AWS-native signals (RDS, ElastiCache/Redis) and bridge-pushed app metrics.
#
# SLO mapping: docs/backend/slo.md §3 (availability), §4 (burn-rate alerts),
# §5 (ingest freshness). Alert tiers: page (2 h / 5 min burn) vs. warning (ops channel).

AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CloudWatch alarms for the Fleet Management Platform. Pages on-call on SLO breach;
  warnings go to the ops Slack channel via a separate SNS subscription.

Parameters:
  AlertSnsTopic:
    Type: String
    Description: ARN of the PagerDuty SNS topic (error budget burn / 5xx / ingest lag).
  WarningSnsTopic:
    Type: String
    Description: ARN of the ops-channel SNS topic (warnings, slow burn).
  RedisReplicationGroupId:
    Type: String
    Description: ElastiCache replication group id (e.g. fleet-redis).
  DbInstanceIdentifier:
    Type: String
    Description: RDS DB instance identifier for the fleet primary.
  MetricsNamespace:
    Type: String
    Default: Fleet/Observability

Resources:
  # ──────────────────────────────────────────────────────────────────────────
  # API error rate — SLO A-01: ≤ 0.1 % 5xx (99.9 % success)
  # 36x burn-rate for 2 h → page; 6x for 2 h → warning.
  #
  # The numerator and the denominator are DIFFERENT metrics: fleet_errors_total
  # counts errors, fleet_http_requests_total counts requests. Dividing a request
  # count by itself always yields 1, and the Average of a counter is
  # meaningless - counters are summed over the period.
  # ──────────────────────────────────────────────────────────────────────────
  ApiErrorRateAlarm:
    Type: AWS::CloudWatch::MetricMathAlarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-api-5xx-rate"
      AlarmDescription: "API 5xx error rate exceeded 0.1 % (SLO A-01)"
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertSnsTopic
      OKActions:
        - !Ref AlertSnsTopic
      EvaluationPeriods: 6
      Threshold: 0.1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Ref MetricsNamespace
              MetricName: fleet_errors_total
            Period: 300
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Ref MetricsNamespace
              MetricName: fleet_http_requests_total
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: "IF(requests = 0, 0, 100 * errors / requests)"
          Label: "API error rate (%)"
          ReturnData: true

  ApiErrorRateWarning:
    Type: AWS::CloudWatch::MetricMathAlarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-api-5xx-rate-warning"
      AlarmDescription: "API error rate elevated, SLO A-01 slow burn"
      ActionsEnabled: true
      AlarmActions:
        - !Ref WarningSnsTopic
      OKActions:
        - !Ref WarningSnsTopic
      EvaluationPeriods: 6
      Threshold: 0.05
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Ref MetricsNamespace
              MetricName: fleet_errors_total
            Period: 300
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Ref MetricsNamespace
              MetricName: fleet_http_requests_total
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: "IF(requests = 0, 0, 100 * errors / requests)"
          Label: "API error rate (%)"
          ReturnData: true

  # ──────────────────────────────────────────────────────────────────────────
  # API P95 latency — SLO L-01 (reads ≤200 ms), L-02 (writes ≤600 ms)
  # ──────────────────────────────────────────────────────────────────────────
  ApiReadLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-api-p95-read-latency"
      AlarmDescription: "API P95 read latency exceeded 200 ms (SLO L-01)"
      Namespace: !Ref MetricsNamespace
      MetricName: fleet_http_request_duration_seconds
      # P95 needs the extended statistic; the Average of a latency histogram is
      # the mean of the bucket upper bounds, not a latency percentile. The
      # metric is in SECONDS, so the thresholds are 0.2 s / 0.6 s (200 ms /
      # 600 ms), not 200 / 600.
      ExtendedStatistic: p95
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0.2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopic

  ApiWriteLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-api-p95-write-latency"
      AlarmDescription: "API P95 write latency exceeded 600 ms (SLO L-02)"
      Namespace: !Ref MetricsNamespace
      MetricName: fleet_http_request_duration_seconds
      # P95 needs the extended statistic; see ApiReadLatencyAlarm. Seconds, not
      # milliseconds: 600 ms = 0.6 s.
      ExtendedStatistic: p95
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0.6
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopic

  # ──────────────────────────────────────────────────────────────────────────
  # Telemetry ingest latency & lag — SLOs T-01, T-02, T-03, T-04
  # ──────────────────────────────────────────────────────────────────────────
  TelemetryIngestLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-telemetry-ingest-lag"
      AlarmDescription: "Telemetry ingest lag exceeded 30 s (SLO T-01/T-02)"
      Namespace: !Ref MetricsNamespace
      MetricName: fleet_telemetry_ingest_lag_seconds
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 30
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertSnsTopic

  TelemetryStreamDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-telemetry-stream-depth"
      AlarmDescription: "Traccar positions stream depth exceeded 50 000 (SLO T-03)"
      Namespace: !Ref MetricsNamespace
      MetricName: fleet_redis_stream_depth
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertSnsTopic

  TelemetryStreamDepthWarning:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-telemetry-stream-depth-warning"
      AlarmDescription: "Traccar positions stream depth elevated > 10 000 (SLO T-03)"
      Namespace: !Ref MetricsNamespace
      MetricName: fleet_redis_stream_depth
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref WarningSnsTopic

  # ──────────────────────────────────────────────────────────────────────────
  # Worker job error rate — SLO A-04: ≥ 99 % jobs succeed
  # ──────────────────────────────────────────────────────────────────────────
  WorkerJobErrorRateAlarm:
    Type: AWS::CloudWatch::MetricMathAlarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-worker-job-error-rate"
      AlarmDescription: "Worker job error rate exceeded 1 % (SLO A-04)"
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertSnsTopic
      OKActions:
        - !Ref AlertSnsTopic
      EvaluationPeriods: 4
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Metrics:
        # The Average of a counter is not a rate: it is the per-period job count,
        # so "Average > 1" fired on every period in which the worker was simply
        # doing its job. The failure share needs the `result` label, so the
        # numerator is a search over fleet_worker_jobs_total{result="FAILED"}.
        - Id: failed
          ReturnData: false
          Expression: !Sub "SEARCH('{${MetricsNamespace},fleet_worker_jobs_total} MetricName=\"fleet_worker_jobs_total\" AND result=\"FAILED\"', 'Sum', 300)"
          Label: failed jobs
        - Id: total
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Ref MetricsNamespace
              MetricName: fleet_worker_jobs_total
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: "IF(total = 0, 0, 100 * failed / total)"
          Label: "failed job share (%)"
          ReturnData: true

  # ──────────────────────────────────────────────────────────────────────────
  # Metric-velocity / silent-failure detection (#5 audit item).
  #
  # A HALTED ingest pipeline is invisible to error-rate alarms (errors stay flat while
  # throughput drops to zero). These alarms make a stalled/quiet pipeline page.
  #
   #    (a) fleet_telemetry_ingest_total throughput rate — fires when processed positions/min drop below floor.
   #    (b) fleet_telemetry_ingest_total / fleet_errors_total ratio — fires when throughput collapses while errors are flat.
   #     Implemented with CloudWatch MetricMath: ratio = processed / max(errors,1). When processed
   #     collapses but errors stay >0 this ratio craters; when both are zero the ratio is pinned to
   #     100 (no breach) and the rate alarm (a) catches the full stall instead, because the counter
   #     still exists with a sum of 0.
  # ──────────────────────────────────────────────────────────────────────────
  IngestProcessedRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-ingest-processed-rate"
      AlarmDescription: "Ingest throughput (fleet_telemetry_ingest_total) dropped below 1/min — possible stalled pipeline (silent failure)"
      Namespace: !Ref MetricsNamespace
      MetricName: fleet_telemetry_ingest_total
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # A quiet night (no vehicles moving) produces a real 0, not missing data.
      # Treating missing data as breaching paged on-call every night.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopic
      OKActions:
        - !Ref AlertSnsTopic

  IngestVelocityMath:
    Type: AWS::CloudWatch::MetricMathAlarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-ingest-velocity-math"
      AlarmDescription: "Metric-velocity composite: fleet_telemetry_ingest_total collapses while errors stay flat (silent failure)"
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertSnsTopic
      OKActions:
        - !Ref AlertSnsTopic
      EvaluationPeriods: 2
      Threshold: 0.5
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: processed
          MetricStat:
            Metric:
              Namespace: !Ref MetricsNamespace
              MetricName: fleet_telemetry_ingest_total
            Period: 300
            Stat: Sum
        - Id: errs
          MetricStat:
            Metric:
              Namespace: !Ref MetricsNamespace
              MetricName: fleet_errors_total
            Period: 300
            Stat: Sum
        - Id: ratio
          # processed = 0 and errs = 0 is a quiet night, not a failure: the rate
          # alarm below catches the full stall (the counter still exists, its sum
          # is 0). processed = 0 with errors > 0 IS a failure.
          Expression: "IF(processed = 0, IF(errs = 0, 100, 0), processed / GREATEST(errs, 1))"
          Label: "ingest processed per error (floor 1)"

  # ──────────────────────────────────────────────────────────────────────────
  # Dead-letter / poison-message alarms (referenced by packages/db/src/outbox.ts
  # `fleet_worker_dead_lettered_total` and packages/worker/src/ingest/consumer.ts
  # `fleet_ingest_dead_lettered_total`). Any dead-letter means a job/position exhausted retries.
  # ──────────────────────────────────────────────────────────────────────────
  WorkerJobDeadLetteredAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-worker-job-dead-lettered"
      AlarmDescription: "Worker outbox handler dead-lettered (exhausted retries)"
      Namespace: !Ref MetricsNamespace
      MetricName: fleet_worker_dead_lettered_total
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopic

  IngestDeadLetteredAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-ingest-dead-lettered"
      AlarmDescription: "Ingest batch consumed but produced zero retained positions (discarded/malformed)"
      Namespace: !Ref MetricsNamespace
      MetricName: fleet_ingest_dead_lettered_total
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopic

  # ──────────────────────────────────────────────────────────────────────────
  # Worker job P95 latency — SLO L-04
  # ──────────────────────────────────────────────────────────────────────────
  WorkerJobLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-worker-p95-job-latency"
      AlarmDescription: "Worker P95 job latency exceeded 60 s (SLO L-04)"
      Namespace: !Ref MetricsNamespace
      MetricName: fleet_worker_job_duration_seconds
      # P95 needs the extended statistic; the metric is in seconds and the
      # threshold is 60 s.
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 4
      Threshold: 60
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopic

  # ──────────────────────────────────────────────────────────────────────────
  # RDS / PostgreSQL — connections + replica lag (SLO A-05)
  # ──────────────────────────────────────────────────────────────────────────
  DbConnectionCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-rds-db-connections"
      AlarmDescription: "RDS active connections approaching pool limit (SLO A-05)"
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DbInstanceIdentifier
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WarningSnsTopic

  DbReplicaLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-rds-replica-lag"
      AlarmDescription: "RDS read-replica lag exceeded 30 s (SLO A-05)"
      Namespace: AWS/RDS
      MetricName: ReplicaLag
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DbInstanceIdentifier
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 30
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopic

  # ──────────────────────────────────────────────────────────────────────────
  # ElastiCache / Redis — CPU, memory, swap eviction (SLO A-06)
  # ──────────────────────────────────────────────────────────────────────────
  RedisCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-redis-cpu"
      AlarmDescription: "Redis CPU utilization exceeded 85 %"
      Namespace: AWS/ElastiCache
      MetricName: CPUUtilization
      Dimensions:
        - Name: CacheClusterId
          Value: !Ref RedisReplicationGroupId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WarningSnsTopic

  RedisMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-redis-memory"
      AlarmDescription: "Redis memory utilization exceeded 85 % of maxmemory (eviction risk)"
      Namespace: AWS/ElastiCache
      MetricName: BytesUsedForCache
      Dimensions:
        - Name: CacheClusterId
          Value: !Ref RedisReplicationGroupId
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      # 85 % of the 20 GiB Redis volume: 0.85 * 21474836480 = 18253611008
      Threshold: 18253611008
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopic

  RedisSwapEvictionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MetricsNamespace}-redis-eviction"
      AlarmDescription: "Redis swap/EvictedKeys > 0 — memory pressure causing data loss"
      Namespace: AWS/ElastiCache
      MetricName: EvictedKeys
      Dimensions:
        - Name: CacheClusterId
          Value: !Ref RedisReplicationGroupId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopic

Outputs:
  AlertTopic:
    Description: "SNS topic ARN for SLO page alerts"
    Value: !Ref AlertSnsTopic
  WarningTopic:
    Description: "SNS topic ARN for SLO warning alerts"
    Value: !Ref WarningSnsTopic
