# =============================================================================
# deploy/k8s - Production on AWS EKS (decision A1.10)
#
# Scope: workload manifests only. RDS Postgres+PostGIS, ElastiCache (AOF), S3
# (with Object Lock bucket) and the LoadBalancer/Ingress are provisioned via
# Terraform/IaC (out of scope of this repository). These manifests assume:
#   * a Postgres connection string secret (fleet/db, key DATABASE_URL)
#   * a Redis URL secret (fleet/redis, key REDIS_URL)
#   * external secrets for FCM / Google Vision / Africa's Talking
#   * an OIDC/internal CA issuer for mTLS between services (service mesh optional)
#
# Runtime contract:
#   * the API image serves HTTP on $PORT (4000) and answers GET /healthz
#     (always 200), GET /readyz (DB + Redis) and GET /health/deep
#   * the worker image serves GET /healthz and GET /readyz on $HEALTH_PORT (8082)
#   * the compiled entrypoints are packages/api/dist/server.js and
#     packages/worker/dist/index.js, because every package tsconfig sets
#     outDir relative to the package
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: fleet
  labels:
    app.kubernetes.io/part-of: fleet-management
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fleet-quota
  namespace: fleet
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 40Gi
    limits.cpu: "80"
    limits.memory: 80Gi
    pods: "60"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-config
  namespace: fleet
data:
  NODE_ENV: "production"
  # The API's env schema defaults PORT to 8080; every probe, containerPort and
  # Service targetPort in this manifest uses 4000, so the port is pinned here.
  PORT: "4000"
  # The worker exposes its health server on HEALTH_PORT.
  HEALTH_PORT: "8082"
  TRACCAR_BASE_URL: "http://traccar.fleet.svc.cluster.local:8082"
  # N2.3: durable Redis Stream forward; HTTP + back-fill poller is the fallback.
  FORWARD_REDIS_URI: "redis://redis.fleet.svc.cluster.local:6379/0"
  FORWARD_REDIS_CHANNEL: "traccar:positions"
  LOG_FORMAT: "json"
  TZ: "Africa/Nairobi"
  # SendGrid / SES relay is configured by the IaC layer, not here.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-api
  namespace: fleet
  annotations:
    # IAM Roles for Service Accounts: scoped to S3 (incl. Object Lock), KMS, SSM.
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/fleet-api-role"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fleet
  labels: { app: fleet-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: fleet-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: fleet-api }
    spec:
      serviceAccountName: fleet-api # checkov:skip=CKV_K8S_38:IRSA — the api requires the SA token to obtain AWS credentials for S3/KMS/SSM
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Applies db/schema + db/seed before the API can serve a request. The
        # script is idempotent (public.schema_migrations), so this is a no-op
        # when the db-migrate Job below already ran, and it is what makes the
        # Deployment depend on the migration instead of racing it.
        - name: migrate
          image: ACCOUNT_ID.dkr.ecr.af-south-1.amazonaws.com/fleet-api:1.0.0 # checkov:skip=CKV_K8S_43:digest pinning is applied at release time by the CD pipeline, not in the template
          imagePullPolicy: Always
          command: ["bash", "-c"]
          args:
            - |
              set -u
              for i in $(seq 1 12); do
                if bash /app/db/migrate.sh; then exit 0; fi
                echo "migrate attempt $i failed; retrying in 10s"
                sleep 10
              done
              echo "migration did not complete" >&2
              exit 1
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: fleet-db, key: DATABASE_URL } # checkov:skip=CKV_K8S_35:12-factor app reads secrets from env; file-based secret projection is a future hardening step
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: api
          image: ACCOUNT_ID.dkr.ecr.af-south-1.amazonaws.com/fleet-api:1.0.0 # checkov:skip=CKV_K8S_43:digest pinning is applied at release time by the CD pipeline, not in the template
          imagePullPolicy: Always
          args: ["node", "packages/api/dist/server.js"]
          ports: [{ containerPort: 4000, name: http }]
          envFrom:
            - configMapRef: { name: fleet-config }
            - secretRef: { name: fleet-secrets } # checkov:skip=CKV_K8S_35:12-factor app reads secrets from env; file-based secret projection is a future hardening step
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: fleet-db, key: DATABASE_URL } # checkov:skip=CKV_K8S_35:12-factor app reads secrets from env
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: fleet-redis, key: REDIS_URL } # checkov:skip=CKV_K8S_35:12-factor app reads secrets from env
          # /healthz is always 200: it must not depend on the database or Redis,
          # or a dependency outage would restart every pod.
          readinessProbe:
            httpGet: { path: /readyz, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fleet
spec:
  selector: { app: fleet-api }
  ports: [{ port: 80, targetPort: 4000 }]
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fleet
  labels: { app: fleet-worker }
spec:
  replicas: 3
  selector:
    matchLabels: { app: fleet-worker }
  template:
    metadata:
      labels: { app: fleet-worker }
    spec:
      serviceAccountName: fleet-api # checkov:skip=CKV_K8S_38:IRSA — the worker requires the SA token to obtain AWS credentials for S3 media/KMS
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ACCOUNT_ID.dkr.ecr.af-south-1.amazonaws.com/fleet-api:1.0.0 # checkov:skip=CKV_K8S_43:digest pinning is applied at release time by the CD pipeline, not in the template
          imagePullPolicy: Always
          args: ["node", "packages/worker/dist/index.js", "--role", "worker"]
          ports: [{ containerPort: 8082, name: health }]
          envFrom:
            - configMapRef: { name: fleet-config }
            - secretRef: { name: fleet-secrets } # checkov:skip=CKV_K8S_35:12-factor app reads secrets from env; file-based secret projection is a future hardening step
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: fleet-db, key: DATABASE_URL } # checkov:skip=CKV_K8S_35:12-factor app reads secrets from env
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: fleet-redis, key: REDIS_URL } # checkov:skip=CKV_K8S_35:12-factor app reads secrets from env
            # The image HEALTHCHECK must probe the worker's health port, not the
            # API port.
            - name: HEALTHCHECK_PORT
              value: "8082"
          readinessProbe:
            httpGet: { path: /readyz, port: 8082 }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traccar
  namespace: fleet
  labels: { app: traccar }
spec:
  replicas: 2
  selector:
    matchLabels: { app: traccar }
  template:
    metadata:
      labels: { app: traccar }
    spec:
      # Traccar talks only to Postgres and Redis — no Kubernetes API, no AWS.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: traccar
          # Pinned to an explicit release: `latest` made the running server
          # change under a rollout with no image digest to trace it back to.
          image: traccar/traccar:6.16.0 # checkov:skip=CKV_K8S_43:digest pinning is applied at release time by the CD pipeline, not in the template
          imagePullPolicy: Always
          ports:
            - { containerPort: 8082, name: web }
            - { containerPort: 5005, name: tracker }
          env:
            # Without this flag Traccar ignores the environment variables below
            # and falls back to the image's bundled traccar.xml.
            - name: CONFIG_USE_ENVIRONMENT_VARIABLES
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: fleet-traccar-db, key: DATABASE_URL } # checkov:skip=CKV_K8S_35:upstream Traccar only reads its config from env; file-based secret projection is not supported by the image
            - name: DATABASE_DRIVER
              value: "org.postgresql.Driver"
            # N2.3: durable forward.
            - name: FORWARD_REDIS_ENABLED
              value: "true"
            - name: FORWARD_REDIS_URI
              value: "redis://redis.fleet.svc.cluster.local:6379/0"
            - name: FORWARD_REDIS_CHANNEL
              value: "traccar:positions"
          readinessProbe:
            tcpSocket: { port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/server, port: 8082 }
            initialDelaySeconds: 60
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            # Traccar creates its home subdirectories (media/, export/, ...) under
            # /opt/traccar at start-up and offers no way to relocate them, so a
            # read-only root aborts the boot. The writable paths that carry
            # state are backed by emptyDir volumes below.
            readOnlyRootFilesystem: false # checkov:skip=CKV_K8S_22:upstream Traccar writes to /opt/traccar at start-up and cannot be relocated
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - { name: traccar-data, mountPath: /opt/traccar/data }
            - { name: traccar-logs, mountPath: /opt/traccar/logs }
      volumes:
        - name: traccar-data
          emptyDir: {}
        - name: traccar-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: traccar
  namespace: fleet
spec:
  selector: { app: traccar }
  ports:
    - { name: web, port: 8082, targetPort: 8082 }
    - { name: tracker, port: 5005, targetPort: 5005 }
  type: ClusterIP
---
# Redis runs as ONE instance behind one ClusterIP.
#
# The previous manifest ran three replicas of a standalone server
# (--cluster-enabled no) with one ReadWriteOnce PVC each. Those were three
# unrelated databases behind one service name: a session token minted by pod A
# was invisible to pod B, so roughly two thirds of legitimate refreshes
# failed, and the rate-limit counters were split three ways. One instance with
# one PVC is the only topology that is correct without a real cluster.
#
# Trade-off: Redis is now a single point of failure. A pod restart drops the
# in-flight buffer (AOF keeps it on the PVC) and takes sessions and rate
# limits down with it. The next step is Redis Sentinel (or ElastiCache) with
# automatic failover, which needs a quorum and a rewrite of the REDIS_URL
# resolution - not a config change on this manifest.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: fleet
  labels: { app: redis }
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      # Redis serves the API/worker only — no Kubernetes API, no AWS.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        # C5.10: AOF so the pending:gps buffer survives restart.
        - name: redis
          image: redis:7-alpine # checkov:skip=CKV_K8S_43:digest pinning is applied at release time by the CD pipeline, not in the template
          imagePullPolicy: Always
          command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--cluster-enabled", "no"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fleet
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: fleet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: fleet
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: fleet-api }
---
# =============================================================================
# Schema migration
# =============================================================================
# Applies db/schema/*.sql and db/seed/*.sql to the live DATABASE_URL.
#
# The helm.sh/hook annotations make this a pre-install/pre-upgrade hook when
# the manifest is rendered by Helm. Under plain `kubectl apply` the hook
# annotations are inert, so the API Deployment also runs the same script as an
# init container: the script is idempotent (public.schema_migrations) and holds
# an advisory lock, so whichever runs first applies the schema and the other
# one is a no-op.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: fleet
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: db-migrate }
    spec:
      restartPolicy: Never
      serviceAccountName: fleet-api
      # The migration job never touches the Kubernetes API or AWS.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ACCOUNT_ID.dkr.ecr.af-south-1.amazonaws.com/fleet-api:1.0.0 # checkov:skip=CKV_K8S_43:digest pinning is applied at release time by the CD pipeline, not in the template
          imagePullPolicy: Always
          command: ["bash", "/app/db/migrate.sh"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: fleet-db, key: DATABASE_URL } # checkov:skip=CKV_K8S_35:12-factor app reads secrets from env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
# Nightly partition maintenance + retention sweep (7.3/D6) and the daily
# document-expiry scan run inside the worker; this CronJob is a safety net that
# guarantees partition provisioning even if the worker is down.
#
# The provisioning functions are SQL, so the job calls them through psql. The
# previous command pointed at dist/scripts/partition-maint.js, which does not
# exist in the image: the job failed on every run and no partition was ever
# provisioned by the safety net.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: partition-maint
  namespace: fleet
spec:
  schedule: "13 1 * * *"     # 01:13 EAT, after the daily document-expiry run
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: fleet-api
          restartPolicy: OnFailure
          # The partition job only runs psql against the DATABASE_URL — no
          # Kubernetes API, no AWS.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: partition-maint
              image: ACCOUNT_ID.dkr.ecr.af-south-1.amazonaws.com/fleet-api:1.0.0 # checkov:skip=CKV_K8S_43:digest pinning is applied at release time by the CD pipeline, not in the template
              imagePullPolicy: Always
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 -c "SELECT * FROM telemetry.fn_ensure_location_partitions(3);"
                  psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 -c "SELECT * FROM app.fn_ensure_error_event_partitions(3);"
                  psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 -c "SELECT * FROM audit.fn_ensure_audit_partitions(1);"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: { name: fleet-db, key: DATABASE_URL } # checkov:skip=CKV_K8S_35:12-factor app reads secrets from env
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                limits: { cpu: "250m", memory: "512Mi" }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
