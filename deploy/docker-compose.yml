# =============================================================================
# docker-compose.yml  —  Local development only
# Production runs on AWS EKS via deploy/k8s/* (decision A1.10).
# =============================================================================

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      # Credentials/port match the backend's own defaults (packages/api/src/config/env.ts and
      # db/validate.sh: postgres / pg_local_dev / 5444) so a host-run API and `npm run
      # db:validate:bash` need no env at all. Only ever local credentials.
      #
      # POSTGRES_USER/POSTGRES_PASSWORD are applied by `initdb` ONLY. A `pgdata` volume created
      # before this change still has the old `fleet` role, and pg_isready does not authenticate, so
      # the healthcheck stays green while every connection fails. After changing them:
      #   docker compose down -v && docker compose up -d postgres redis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg_local_dev
      POSTGRES_DB: fleet
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The Postgres entrypoint only runs *.sh / *.sql / *.sql.gz files sitting DIRECTLY in
      # /docker-entrypoint-initdb.d — a bind-mounted directory there is skipped ("ignoring …"), which
      # is why the database used to come up empty. init-db.sh is the one entrypoint-visible file and
      # applies schema/ then seed/ in order. Paths resolve against THIS file's directory (deploy/).
      - ./init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
      - ../db/schema:/docker-entrypoint-initdb.d/schema:ro
      - ../db/seed:/docker-entrypoint-initdb.d/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    # NOTE: do not override CMD — the postgis image preloads its extensions via its own
    # entrypoint. Forcing `shared_preload_libraries=postgis` here makes Postgres fail to
    # start (could not access file "postgis"). PITR (wal_level=replica) is a prod concern.

  redis:
    image: redis:7-alpine
    # C5.10: AOF enabled so the telemetry buffer survives a restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  traccar:
    image: traccar/traccar:latest
    depends_on:
      - postgres
    environment:
      # N2.1/N2.2: Traccar uses its OWN database on the same Postgres instance.
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://postgres:5432/traccar
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pg_local_dev
      # N2.3: durable forward to a Redis Stream, not fire-and-forget HTTP.
      # The exact forwarding transport is verified at integration time against the
      # pinned Traccar version; if unavailable we use HTTP + the back-fill poller.
      FORWARD_REDIS_ENABLED: "true"
      FORWARD_REDIS_URI: redis://redis:6379/0
      FORWARD_REDIS_CHANNEL: traccar:positions
    ports:
      - "8082:8082"     # Traccar web UI (device provisioning)
      - "5005:5005"     # default tracker port (informational; trackers are user-supplied)
    volumes:
      - traccardata:/opt/traccar/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: dev
    command: ["npm", "run", "dev:api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traccar:
        condition: service_healthy
    environment:
      # The published port is 4000 and the mobile app defaults to
      # http://localhost:4000/api/v1, but the API's own default is PORT=8080. Without this the
      # container listened on 8080 and the published 4000 port refused every connection.
      PORT: "4000"
      DATABASE_URL: postgresql://postgres:pg_local_dev@postgres:5432/fleet
      REDIS_URL: redis://redis:6379/0
      TRACCAR_BASE_URL: http://traccar:8082
      JWT_SECRET: dev-only-not-secret
      S3_BUCKET: fleet-dev
      FCM_CREDENTIALS_PATH: /secrets/fcm.json
      GOOGLE_VISION_KEY_PATH: /secrets/vision.json
      AFRICAS_TALKING_API_KEY: dev
      NODE_ENV: development
    ports:
      - "4000:4000"
    develop:
      watch:
        # Relative to this file (deploy/), so `..` is the repo root. `../..` pointed one level
        # above the repo.
        - action: sync
          path: ..
          target: /app

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: dev
    command: ["npm", "run", "dev:worker"]
    depends_on:
      - postgres
      - redis
      - api
    environment:
      DATABASE_URL: postgresql://postgres:pg_local_dev@postgres:5432/fleet
      REDIS_URL: redis://redis:6379/0
      TRACCAR_BASE_URL: http://traccar:8082
      NODE_ENV: development

volumes:
  pgdata:
  redisdata:
  traccardata:
