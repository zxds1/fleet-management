# =============================================================================
# docker-compose.yml  —  Local development only
# Production runs on AWS EKS via deploy/k8s/* (decision A1.10).
# =============================================================================

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet_local_dev
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d/schema:ro
      - ./db/seed:/docker-entrypoint-initdb.d/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - wal_level=replica            # C5.4 PITR readiness
      - -c
      - shared_preload_libraries=postgis

  redis:
    image: redis:7-alpine
    # C5.10: AOF enabled so the telemetry buffer survives a restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  traccar:
    image: traccar/traccar:latest
    depends_on:
      - postgres
    environment:
      # N2.1/N2.2: Traccar uses its OWN database on the same Postgres instance.
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://postgres:5432/traccar
      DATABASE_USER: fleet
      DATABASE_PASSWORD: fleet_local_dev
      # N2.3: durable forward to a Redis Stream, not fire-and-forget HTTP.
      FORWARD_REDIS_ENABLED: "true"
      FORWARD_REDIS_URI: redis://redis:6379/0
      FORWARD_REDIS_CHANNEL: traccar:positions
    ports:
      - "8082:8082"     # Traccar web UI (device provisioning)
      - "5005:5005"     # default tracker port (informational; trackers are user-supplied)
    volumes:
      - traccardata:/opt/traccar/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: dev
    command: ["npm", "run", "dev:api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traccar:
        condition: service_healthy
    environment:
      PORT: "4000"
      API_BASE_PATH: /api/v1
      DATABASE_URL: postgresql://fleet:fleet_local_dev@postgres:5432/fleet
      REDIS_URL: redis://redis:6379/0
      TRACCAR_BASE_URL: http://traccar:8082
      JWT_SECRET: dev-only-not-secret
      S3_BUCKET: fleet-dev
      FCM_CREDENTIALS_PATH: /secrets/fcm.json
      GOOGLE_VISION_KEY_PATH: /secrets/vision.json
      AFRICAS_TALKING_API_KEY: dev
      NODE_ENV: development
    ports:
      - "4000:4000"
    volumes:
      - ../..:/app
    develop:
      watch:
        - action: sync
          path: ../..
          target: /app

  worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: dev
    command: ["npm", "run", "dev:worker"]
    depends_on:
      - postgres
      - redis
      - api
    environment:
      DATABASE_URL: postgresql://fleet:fleet_local_dev@postgres:5432/fleet
      REDIS_URL: redis://redis:6379/0
      TRACCAR_BASE_URL: http://traccar:8082
      NODE_ENV: development
    volumes:
      - ../..:/app

  ingest:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: dev
    command: ["npm", "run", "dev:ingest"]
    depends_on:
      - postgres
      - redis
      - api
    environment:
      DATABASE_URL: postgresql://fleet:fleet_local_dev@postgres:5432/fleet
      REDIS_URL: redis://redis:6379/0
      TRACCAR_BASE_URL: http://traccar:8082
      NODE_ENV: development
    volumes:
      - ../..:/app

  ws:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: dev
    command: ["npm", "run", "dev:ws"]
    depends_on:
      - postgres
      - redis
      - api
    environment:
      WS_PORT: "4001"
      DATABASE_URL: postgresql://fleet:fleet_local_dev@postgres:5432/fleet
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-not-secret
      JWT_SECRET_PREVIOUS: dev-only-not-secret
      JWT_KID: k1
      JWT_KID_PREVIOUS: k0
      NODE_ENV: development
    ports:
      - "4001:4001"
    volumes:
      - ../..:/app

volumes:
  pgdata:
  redisdata:
  traccardata:
