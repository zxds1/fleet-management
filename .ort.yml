ort:
  analyzer:
    allowDynamicVersions: false
    skipExhaustive: true
  advisor:
    node:
      enabled: false
  downloader:
    gradle:
      allowDynamicVersions: false
  reporter:
    base:
      allowDynamicVersions: false
  evaluator:
    rulesFile: "etc/ort/rules.kts"
  scanner:
    enabled: true

analyzer:
  nonConfigSourceResolver:
    enabled: true

license:
  # Licenses permitted for commercial distribution.
  # Anything not matching is flagged as "non-compliant".
  allowedLicenses:
    - "MIT"
    - "Apache-2.0"
    - "Apache-2.0-Clang"
    - "BSD-3-Clause"
    - "ISC"
    - "Unlicense"
    - "CC0-1.0"
    - "0BSD"
    - "Python-2.0"
  # Licenses that are strictly forbidden because they are copyleft and conflict
  # with commercial distribution.
  forbiddenLicenses:
    - "GPL-2.0-only"
    - "GPL-2.0-or-later"
    - "GPL-3.0-only"
    - "GPL-3.0-or-later"
    - "AGPL-3.0-only"
    - "AGPL-3.0-or-later"
    - "LGPL-2.1-only"
    - "LGPL-2.1-or-later"
    - "LGPL-3.0-only"
    - "LGPL-3.0-or-later"

# Exclude development dependencies from license analysis — dev-only packages
# do not ship in the production container (deploy/Dockerfile → prod target).
package:
  excludePatterns:
    - type: "NPM"
      name: "**"
      options:
        - "dev"
        - "peer"
        - "optional"
