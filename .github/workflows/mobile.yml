name: mobile

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [staging, main]
    paths:
      - 'mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: mobile typecheck / test (S-4 hardening + D-5/D-7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend packages (shared, db, ws, etc.)
        run: npm run build

      - name: Install mobile app dependencies
        run: |
          cd mobile/packages/mobile
          npm install

      - name: Mobile typecheck (strict, noUncheckedIndexedAccess)
        run: |
          cd mobile/packages/mobile
          npm run typecheck

      - name: Mobile unit tests (security, offline queue, apiClient, session, socket, drivers, admin)
        run: |
          cd mobile/packages/mobile
          npm run test

      - name: Secret scan (S-6 — gitleaks pre-commit/CI parity)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        continue-on-error: true

      - name: Supply-chain scan (S-5 — npm audit on the mobile workspace)
        run: |
          cd mobile/packages/mobile
          npm audit --audit-level=high
        continue-on-error: true
