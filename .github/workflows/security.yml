name: Security

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  trivy:
    name: Trivy container scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses:actions/checkout@v4

      - name: Build Dockerfile for scanning
        run: docker build -t fleet-scan -f deploy/Dockerfile .

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fleet-scan'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'results.sarif'

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (for Semgrep JS/TS rules)
        run: npm ci

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'p/security-audit'
          publishDefects: true
          sarif: 'semgrep-results.sarif'

      - name: Upload Semgrep SARIF results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'semgrep-results.sarif'

  gitleaks:
    name: Gitleaks secret scanning
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: '.gitleaks.toml'
          report_format: 'json'
          output: 'gitleaks-report.json'

      - name: Upload gitleaks report for GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_format: 'json'
          sarif_file: 'gitleaks-report.json'

  checkov:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: 'deploy'
          framework: 'kubernetes'
          output_file: 'checkov-results.json'
          soft_fail: true

      - name: Upload Checkov results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: 'checkov-results.json'

  license-check:
    name: Dependency license check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install license-checker
        run: npm install --no-save license-checker-rseidelsohn@1.18.23

      - name: Run license check
        run: |
          license-checker-rseidelsohn \
            --summary \
            --onlyAllow "MIT;Apache-2.0;Apache-2.0-Clang;BSD-3-Clause;ISC;Unlicense;CC0-1.0;0BSD;Python-2.0" \
            --excludeDevTransitive \
            --failOn "GPL;AGPL;LGPL" \
            --json licenses.json

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json

  dependency-confusion:
    name: Dependency confusion check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect internal package leaks
        run: |
          set -euo pipefail
          # Packages that are internal to this monorepo must never resolve to the
          # public npm registry. Check every dependency that begins with our
          # scope prefix (@fleet) for a public registry listing.
          INTERNAL_PACKAGES=$(npm ls --depth=0 --json 2>/dev/null | jq -r '.dependencies // {} | keys[]' | grep -E '^@fleet/.*' || true)
          if [ -z "$INTERNAL_PACKAGES" ]; then
            echo "No internal packages found — nothing to check."
            exit 0
          fi
          echo "Checking internal packages for public registry leaks:"
          echo "$INTERNAL_PACKAGES"
          for PKG in $INTERNAL_PACKAGES; do
            echo "--- $PKG ---"
            # Query npm registry; if it returns a package record with versions,
            # the internal name has leaked and could be hijacked.
            if npm view "$PKG" version --json 2>/dev/null | grep -q .; then
              echo "::error::$PKG is published to the public npm registry — dependency confusion risk!"
              exit 1
            else
              echo "$PKG is not publicly published — OK"
            fi
          done
          echo "No internal package leaks detected."

  dast:
    name: OWASP ZAP Baseline Scan (staging)
    runs-on: ubuntu-latest
    needs: [license-check, dependency-confusion]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build production image
        run: docker build -t fleet-api-staging -f deploy/Dockerfile --target prod .

      - name: Start API container for DAST
        run: |
          docker run -d --name fleet-api \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL="postgresql://postgres:postgres@host.docker.internal:5432/fleet" \
            -e REDIS_URL="redis://host.docker.internal:6379" \
            -e JWT_SECRET="dast-scan-secret" \
            -p 4000:4000 \
            fleet-api-staging
          echo "Waiting for API to become healthy..."
          timeout 60 bash -c 'until curl -sf http://localhost:4000/healthz >/dev/null 2>&1; do sleep 2; done'
          echo "API is healthy — starting ZAP scan."

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.8.0
        with:
          target: 'http://localhost:4000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -d 0'
          fail_action: true

      - name: Upload ZAP scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: 'zap_report.html'

      - name: Stop API container
        if: always()
        run: docker rm -f fleet-api
