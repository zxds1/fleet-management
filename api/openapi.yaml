openapi: 3.0.3
info:
  title: Enterprise Fleet Management Platform API
  version: 1.0.0-locked
  description: >-
    Locked API contract for the Enterprise Fleet Management Platform.
    This document is generated from docs/architecture/00-locked-decisions.md and
    the PostgreSQL schema in db/schema. The frontend team binds the externally
    supplied UI designs to these endpoints (decision A3.6). No UI prescription
    is contained here.

    Conventions (decisions D1, D4, D7, C5.1):
      * Base path /api/v1. JSON only.
      * All timestamps are RFC 3339 in UTC (stored as timestamptz, rendered EAT client-side per A2.3).
      * Cursor pagination via `cursor` / `limit` query params; cursors are opaque.
      * Errors use RFC 7807 problem+json with an `error_code` extension member.
      * Every state-changing request MUST carry `Idempotency-Key: <uuid>` (C5.1).
  contact:
    name: Fleet Platform Architecture
servers:
  - url: https://api.fleet.internal/api/v1
    description: Production (AWS af-south-1, decision A1.10)

tags:
  - name: Auth
  - name: Shifts
  - name: Fuel
  - name: Accidents
  - name: Inspections
  - name: Trailer
  - name: Dashboard
  - name: Reconciliation
  - name: Anomalies
  - name: Documents
  - name: Media
  - name: Hardware
  - name: Vehicles

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key

  parameters:
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor returned by a previous page.
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    operationalDate:
      name: operational_date
      in: query
      schema: { type: string, format: date }
      description: Kenyan operational date (A2.3).
    analyticsFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
      description: Start of the analytics window. Defaults to 30 days before `to`.
    analyticsTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
      description: End of the analytics window. Defaults to now.

  schemas:
    Problem:
      type: object
      description: RFC 7807 problem+json.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: https://docs.fleet.internal/problems/clockout_pending }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uuid }
        error_code:
          type: string
          description: Stable machine-readable code (see Error Codes).
          example: CLOCKOUT_PENDING
        field_errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    CursorPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data: { type: array, items: {} }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, example: "1234.50" }
        currency: { type: string, enum: [KES], default: KES }

    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }

    MediaUploadRequest:
      type: object
      required: [owner_kind, retention_class, content_type]
      properties:
        owner_kind:
          type: string
          enum: [WORK_LOG, INSPECTION_ITEM, FUEL_RECORD, FUEL_PURCHASE, EXPENSE, ACCIDENT_REPORT, ASSET_DOCUMENT, TRAILER_ASSIGNMENT, MAINTENANCE_RECORD, QUARANTINE_EVENT, STATEMENT_IMPORT]
        retention_class:
          type: string
          enum: [WORK_PLAN, INSPECTION, FUEL_RECEIPT, FUEL_DASHBOARD, EXPENSE_RECEIPT, ACCIDENT, ASSET_DOCUMENT, MAINTENANCE, STATEMENT_IMPORT, TRAILER_SWAP]
        content_type: { type: string, example: image/jpeg }
        width_px: { type: integer }
        height_px: { type: integer }
        client_captured_at: { type: string, format: date-time }

    MediaUploadResponse:
      type: object
      required: [media_object_id, upload_url, expires_in_seconds]
      properties:
        media_object_id: { type: string, format: uuid }
        upload_url: { type: string, format: uri }
        expires_in_seconds: { type: integer, example: 60 }
        method: { type: string, example: PUT }

    DriverSummary:
      type: object
      description: Admin driver roster row (A3.7 / admin console).
      required: [user_id, email, mfa_enrolled, status]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string, nullable: true }
        mfa_enrolled: { type: boolean }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        last_login_at: { type: string, format: date-time, nullable: true }
        devices:
          type: array
          items:
            type: object
            required: [device_id, platform]
            properties:
              device_id: { type: string }
              platform: { type: string, enum: [ios, android] }
              last_seen_at: { type: string, format: date-time, nullable: true }

    RevokeSessionsRequest:
      type: object
      description: Target user for a forced global sign-out. Omit user_id to revoke the caller's own sessions.
      properties:
        user_id: { type: string, format: uuid, nullable: true }

    IdempotencyReplay:
      type: object
      required: [replayed, original_status]
      properties:
        replayed: { type: boolean, example: true }
        original_status: { type: integer, example: 201 }
        original_body: { type: object }

    # ── Tenancy (14_tenancy.sql) ───────────────────────────────────────────────────────────────
    InviteUserRequest:
      type: object
      description: Admin invite into the caller's tenant. Role is restricted to invitable roles (FLEET_MANAGER, ADMIN).
      required: [email, role_code]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role_code: { type: string, enum: [FLEET_MANAGER, ADMIN] }
        full_name: { type: string, maxLength: 200 }

    AcceptInviteRequest:
      type: object
      description: Unauthenticated. The single-use token is the credential; a password is set on first use.
      required: [token, password]
      properties:
        token: { type: string, format: uuid }
        password: { type: string, minLength: 12, maxLength: 200 }
        full_name: { type: string, maxLength: 200 }

    Invitation:
      type: object
      description: An outstanding invitation (app.invitations).
      required: [id, tenant_id, email, role_code, status, expires_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role_code: { type: string, enum: [DRIVER, DISPATCHER, FLEET_MANAGER, ADMIN, FINANCE, AUDITOR, SYSTEM_ADMIN] }
        status: { type: string, enum: [PENDING, ACCEPTED, EXPIRED, REVOKED] }
        invited_by: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    RevokeRoleRequest:
      type: object
      required: [role_code]
      properties:
        role_code: { type: string, enum: [DRIVER, DISPATCHER, FLEET_MANAGER, ADMIN, FINANCE, AUDITOR] }

    AssignScopeRequest:
      type: object
      description: Replaces a manager's vehicle/driver scope within the tenant (app.manager_assignments).
      properties:
        vehicle_ids: { type: array, items: { type: string, format: uuid } }
        driver_ids: { type: array, items: { type: string, format: uuid } }

    TenantUserSummary:
      type: object
      required: [user_id, email, status, roles]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        roles: { type: array, items: { type: string } }
        assigned_vehicle_ids: { type: array, items: { type: string, format: uuid } }
        assigned_driver_ids: { type: array, items: { type: string, format: uuid } }

    # ------------------------------------------------------- Vehicles + admin/manager assignment
    # The mobile admin console (packages/mobile/src/core/admin.ts) parses these tolerantly, so the
    # server is free to return the superset of app.vehicles columns it already has.
    VehicleCreateRequest:
      type: object
      description: >
        Onboards a vehicle into the CALLER's tenant. license_plate is unique per tenant
        (vehicles_tenant_plate_unique) and a duplicate is rejected with 409. tenant_id is bound to
        the principal, status defaults to AVAILABLE, is_operational to true, and tracker_imei stays
        NULL until the separate A1.1 pairing flow runs.
      required: [license_plate]
      properties:
        license_plate: { type: string, minLength: 1, maxLength: 20 }
        vehicle_class: { type: string, maxLength: 40 }
        make: { type: string, maxLength: 60 }
        model: { type: string, maxLength: 60 }
        year: { type: integer, minimum: 1950, maximum: 2100 }
        ownership_type: { type: string, maxLength: 40 }
        fuel_tank_capacity_litres: { type: number, exclusiveMinimum: 0, maximum: 5000 }
        notes: { type: string, maxLength: 2000 }

    VehicleUpdateRequest:
      type: object
      description: Patches the narrow set of app.vehicles columns the console owns.
      properties:
        status: { type: string, maxLength: 40 }
        is_operational: { type: boolean }
        notes: { type: string, maxLength: 2000, nullable: true }
        non_operational_reason: { type: string, maxLength: 2000, nullable: true }

    VehicleRecord:
      type: object
      description: One app.vehicles row. Numeric columns are normalised from PG text to numbers.
      required: [id, license_plate]
      properties:
        id: { type: string, format: uuid }
        license_plate: { type: string }
        vehicle_class: { type: string, nullable: true }
        status: { type: string, nullable: true }
        is_operational: { type: boolean, nullable: true }
        non_operational_reason: { type: string, nullable: true }
        make: { type: string, nullable: true }
        model: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        ownership_type: { type: string, nullable: true }
        current_odometer_km: { type: number, nullable: true }
        current_odometer_at: { type: string, nullable: true }
        engine_hours: { type: number, nullable: true }
        fuel_tank_capacity_litres: { type: number, nullable: true }
        notes: { type: string, nullable: true }

    AssignVehicleRequest:
      type: object
      description: >
        Links drivers and other vehicles to one vehicle. REPLACE semantics on both arrays (the
        client sends the complete desired set; an empty array clears that dimension). vehicle_ids
        means LINKED vehicles such as trailers — naming the target itself is rejected.
      properties:
        driver_ids: { type: array, items: { type: string, format: uuid }, maxItems: 500 }
        vehicle_ids: { type: array, items: { type: string, format: uuid }, maxItems: 500 }

    AssignAdminsRequest:
      type: object
      description: >
        Replaces the vehicle + driver sets for one admin/manager (app.manager_assignments). Same
        operation as AssignScopeRequest; both keys default to an empty array because the mobile
        management screen always sends the full desired set.
      properties:
        vehicle_ids: { type: array, items: { type: string, format: uuid }, maxItems: 500 }
        driver_ids: { type: array, items: { type: string, format: uuid }, maxItems: 500 }

    AdminSummary:
      type: object
      description: One admin/manager with the vehicle/driver scope currently assigned to them.
      required: [user_id, email, full_name, roles, status, assigned_vehicle_ids, assigned_driver_ids]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        full_name: { type: string, nullable: true }
        roles: { type: array, items: { type: string } }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        assigned_vehicle_ids: { type: array, items: { type: string, format: uuid } }
        assigned_driver_ids: { type: array, items: { type: string, format: uuid } }

    AdminRoster:
      type: object
      required: [managers]
      properties:
        managers:
          type: array
          items: { $ref: '#/components/schemas/AdminSummary' }

    SignupRequest:
      type: object
      description: >
        Unauthenticated self-service onboarding. Creates the company (app.tenants, TRIAL/BASIC) and
        its first member, who is granted a TENANT-SCOPED ADMIN role — the company super-admin. That
        account sees its whole company and may invite further ADMIN / FLEET_MANAGER users, but it is
        never a cross-tenant SYSTEM_ADMIN. The tenant slug is derived from company_name server-side.
      required: [company_name, email, password]
      properties:
        company_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 200 }
        full_name: { type: string, minLength: 1, maxLength: 200 }

    AnalyticsKpis:
      type: object
      description: Headline counters, already narrowed to the caller's resolved scope.
      required: [vehicles, drivers, distanceKm, fuelCost, anomalies]
      properties:
        vehicles: { type: number }
        drivers: { type: number }
        distanceKm: { type: number }
        fuelCost: { type: number }
        anomalies: { type: number }

    VehicleAnalytics:
      type: object
      required: [vehicle_id, plate, distanceKm, fuelCost, utilisationPct, anomalies]
      properties:
        vehicle_id: { type: string, format: uuid }
        plate: { type: string, nullable: true }
        distanceKm: { type: number }
        fuelCost: { type: number }
        utilisationPct: { type: number, description: Share of days in range with at least one shift. }
        anomalies: { type: number }

    DriverAnalytics:
      type: object
      required: [driver_id, name, distanceKm, shifts, anomalies]
      properties:
        driver_id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        distanceKm: { type: number }
        shifts: { type: number }
        anomalies: { type: number }

    ManagerAnalyticsSummary:
      type: object
      description: One FLEET_MANAGER row inside the company roll-up, scored against their own scope.
      required: [user_id, email, assignedVehicleIds, assignedDriverIds, kpis]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string, nullable: true }
        email: { type: string }
        assignedVehicleIds:
          type: array
          nullable: true
          description: null = unrestricted on this dimension; [] = nothing assigned.
          items: { type: string, format: uuid }
        assignedDriverIds:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        kpis: { $ref: '#/components/schemas/AnalyticsKpis' }

    CompanyAnalytics:
      type: object
      description: >
        Company roll-up plus one row per FLEET_MANAGER. The flat counters (active_fleet …
        anomalies_open) mirror the mobile AnalyticsReportSchema so GET /reports/analytics parses
        this body unchanged.
      required: [tenant_id, from, to, kpis, managers, active_fleet, open_accidents, pending_dvir, expiring_docs, fuel_spend_30d, anomalies_open]
      properties:
        tenant_id: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        kpis: { $ref: '#/components/schemas/AnalyticsKpis' }
        managers:
          type: array
          items: { $ref: '#/components/schemas/ManagerAnalyticsSummary' }
        active_fleet: { type: number }
        open_accidents: { type: number }
        pending_dvir: { type: number }
        expiring_docs: { type: number }
        fuel_spend_30d: { type: number }
        anomalies_open: { type: number }

    ManagerAnalytics:
      type: object
      description: One manager's slice, expanded per vehicle and per driver.
      required: [user_id, email, from, to, assignedVehicleIds, assignedDriverIds, kpis, vehicles, drivers]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string, nullable: true }
        email: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        assignedVehicleIds:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        assignedDriverIds:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        kpis: { $ref: '#/components/schemas/AnalyticsKpis' }
        vehicles:
          type: array
          items: { $ref: '#/components/schemas/VehicleAnalytics' }
        drivers:
          type: array
          items: { $ref: '#/components/schemas/DriverAnalytics' }

    VehicleAnalyticsDetail:
      type: object
      required: [from, to, vehicle, kpis]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        vehicle: { $ref: '#/components/schemas/VehicleAnalytics' }
        kpis: { $ref: '#/components/schemas/AnalyticsKpis' }

    DriverAnalyticsDetail:
      type: object
      required: [from, to, driver, kpis]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        driver: { $ref: '#/components/schemas/DriverAnalytics' }
        kpis: { $ref: '#/components/schemas/AnalyticsKpis' }

    LoginResponse:
      type: object
      description: Authenticated session (mirrors the mobile client's trusted response body).
      required: [token_type, access_token, refresh_token, user_id, roles, permissions, locale]
      properties:
        token_type: { type: string, example: Bearer }
        access_token: { type: string }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_token_expires_at: { type: string, format: date-time }
        session_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        locale: { type: string, enum: [en, sw] }
        tenant_id: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request (RFC7807).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing / expired token.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Authenticated but lacking permission.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource not found.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Optimistic / state conflict.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    SemanticViolation:
      description: Business-rule violation (e.g. odometer decreased, missing closeout evidence).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    RateLimited:
      description: Too many attempts (offline PIN / SMS rate-limit).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    IdempotencyConflict:
      description: Idempotency-Key reused with a different body (C5.1).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ServiceUnavailable:
      description: Maintenance / downstream outage.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

paths:
  # ------------------------------------------------------------------ Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate by email + password (+ MFA if enrolled).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                mfa_code: { type: string, description: Required when the user has MFA enrolled (A3.7). }
                device_id_hash: { type: string, description: Required for driver PIN offline revocation path (B12). }
      responses:
        '200':
          description: Tokens issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  mfa_required: { type: boolean }
                  roles: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Account suspended (B13).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /auth/mfa/enroll:
    post:
      tags: [Auth]
      summary: Begin TOTP enrolment (Admin / Fleet Manager only, A3.7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Provisioning URI + recovery codes (recovery codes shown once).
          content:
            application/json:
              schema:
                type: object
                properties:
                  provisioning_uri: { type: string, format: uri }
                  secret_encrypted_preview: { type: string }
                  recovery_codes: { type: array, items: { type: string } }

  /devices/{deviceId}/pin:
    put:
      tags: [Auth]
      summary: Set / reset the local 4-digit driver PIN on a device (B12, M4).
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: '^[0-9]{4}$' }
      responses:
        '204': { description: PIN hash stored on device. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/{deviceId}/revoke:
    post:
      tags: [Security]
      summary: Revoke a device (forces the driver to re-authenticate; D-3 / session cap).
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Device revoked; its sessions are invalidated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/revoke:
    post:
      tags: [Security]
      summary: Force a global sign-out for a user (revoke all sessions). Omit user_id for self.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeSessionsRequest' }
      responses:
        '204': { description: All sessions for the target user invalidated. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /drivers:
    get:
      tags: [Admin]
      summary: List drivers for the admin console (A3.7). Cursor-paginated.
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ACTIVE, SUSPENDED] }
      responses:
        '200':
          description: Cursor page of driver summaries.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, has_more]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DriverSummary' } }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ Shifts
  /shifts/clock-in:
    post:
      tags: [Shifts]
      summary: Start a shift (1.1). Requires start odometer photo + gauge (B1).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignment_id, start_odometer_km, start_fuel_gauge, start_media_object_id, consent_version]
              properties:
                assignment_id: { type: string, format: uuid }
                start_odometer_km: { type: integer, minimum: 0 }
                start_fuel_gauge: { type: string, enum: [EMPTY, QUARTER, HALF, THREE_QUARTER, FULL] }
                start_media_object_id: { type: string, format: uuid }
                phone_gps_fallback_enabled: { type: boolean, default: false }
                consent_version: { type: string, description: Required GPS tracking consent version (C5.5). }
      responses:
        '201':
          description: Shift opened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift_id: { type: string, format: uuid }
                  clock_in_at: { type: string, format: date-time }
                  disclaimer: { type: string }
        '409':
          description: A prior shift is awaiting close-out; the missing artefacts are listed.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: HOS rest block (C3.3) or odometer decreased (C4.2) or consent missing (C5.5).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /shifts/clock-out:
    post:
      tags: [Shifts]
      summary: End the active shift (1.4). Requires end odometer photo + gauge.
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id, end_odometer_km, end_fuel_gauge, end_media_object_id]
              properties:
                shift_id: { type: string, format: uuid }
                end_odometer_km: { type: integer, minimum: 0 }
                end_fuel_gauge: { type: string, enum: [EMPTY, QUARTER, HALF, THREE_QUARTER, FULL] }
                end_media_object_id: { type: string, format: uuid }
                debrief_notes: { type: string }
      responses:
        '200':
          description: Shift closed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift_id: { type: string, format: uuid }
                  state: { type: string, enum: [OPEN, PENDING_CLOSEOUT, CLOSED] }
                  shift_duration_seconds: { type: integer }
                  distance_km: { type: number }
        '422': { $ref: '#/components/responses/SemanticViolation' }

  /shifts/me/active:
    get:
      tags: [Shifts]
      summary: Get the driver's currently open shift, if any.
      responses:
        '200':
          description: Active shift or null.
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  shift_id: { type: string, format: uuid }
                  vehicle_id: { type: string, format: uuid }
                  trailer_id: { type: string, format: uuid, nullable: true }
                  clock_in_at: { type: string, format: date-time }

  /shifts/verification-inbox:
    get:
      tags: [Shifts]
      summary: Paged list for the verification inbox (2.7). Fleets Manager / Finance.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/operationalDate'
        - name: verification_status
          in: query
          schema: { type: string, enum: [PENDING, VERIFIED, FLAGGED] }
        - name: state
          in: query
          schema: { type: string, enum: [OPEN, PENDING_CLOSEOUT, CLOSED] }
      responses:
        '200':
          description: Page of shifts (see app.v_shift_verification_inbox).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursorPage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /shifts/{shiftId}/verify:
    post:
      tags: [Shifts]
      summary: Verify and lock a shift for payroll (2.7). Idempotent.
      security:
        - bearerAuth: []
        - idempotencyKey: []
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [VERIFY, FLAG] }
                flag_reason: { type: string }
                corrected_end_odometer_km: { type: integer, description: Only via Unlock-for-correction (B18). }
      responses:
        '200': { description: Shift updated. }
        '409':
          description: Acknowledge-based unlock required before correction (B18).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  # ------------------------------------------------------------------ Fuel
  /fuel/refuel:
    post:
      tags: [Fuel]
      summary: Submit a refuel with mandatory before/after gauge photos (B3).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id, vehicle_id, litres, total_cost, odometer_km, fuel_card_last_four, purchased_at, before_fuel_record_id, after_fuel_record_id, receipt_media_object_id]
              properties:
                shift_id: { type: string, format: uuid, nullable: true, description: null when Admin back-entry (A1.5). }
                vehicle_id: { type: string, format: uuid }
                fuel_card_id: { type: string, format: uuid, nullable: true }
                fuel_card_last_four: { type: string, pattern: '^[0-9]{4}$' }
                litres: { type: number, exclusiveMinimum: 0 }
                total_cost: { $ref: '#/components/schemas/Money' }
                odometer_km: { type: integer, minimum: 0 }
                purchased_at: { type: string, format: date-time }
                before_fuel_record_id: { type: string, format: uuid }
                after_fuel_record_id: { type: string, format: uuid }
                receipt_media_object_id: { type: string, format: uuid }
                supplier_name: { type: string }
      responses:
        '201':
          description: Purchase recorded (pending verification).
          content:
            application/json:
              schema:
                type: object
                properties:
                  fuel_purchase_id: { type: string, format: uuid }
                  open_anomalies: { type: array, items: { type: string } }
        '422':
          description: Missing mandatory gauge pair for a driver entry (B3) — database rejects.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /fuel/purchases/{purchaseId}/verify:
    post:
      tags: [Fuel]
      summary: Verify / reject / adjust a fuel purchase (2.5).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      parameters:
        - name: purchaseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [VERIFY, REJECT, CLEAR_PAYMENT] }
                adjusted_litres: { type: number, description: Fleets Manager only (C6.1). }
                rejection_reason: { type: string }
      responses:
        '200': { description: Updated. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /fuel/reconciliation-inbox:
    get:
      tags: [Fuel]
      summary: Paged fuel reconciliation inbox (2.7).
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: unverified_only
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Page (see app.v_fuel_reconciliation_inbox).
          content: { application/json: { schema: { $ref: '#/components/schemas/CursorPage' } } }

  # ------------------------------------------- Fuel (photo-first capture, A1.4)
  /driver/fuel/purchase:
    post:
      tags: [Fuel]
      summary: Photo-first refuel submission — receipt + odometer photographs (A1.4).
      description: >-
        The driver submits two photographs and the odometer reading only. Litres,
        amount, station and receipt date are extracted server-side by OCR and stay
        advisory until an Admin verifies the purchase.
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipt_media_object_id, odometer_photo_media_object_id, odometer_reading, shift_id, vehicle_id, purchased_at]
              properties:
                receipt_media_object_id: { type: string, format: uuid }
                odometer_photo_media_object_id: { type: string, format: uuid }
                odometer_reading: { type: integer, minimum: 0 }
                shift_id: { type: string, format: uuid, nullable: true, description: null when Admin back-entry (A1.5). }
                vehicle_id: { type: string, format: uuid }
                fuel_card_last_four: { type: string, pattern: '^[0-9]{4}$' }
                purchased_at: { type: string, format: date-time }
      responses:
        '201':
          description: Purchase recorded; OCR queued (ocr_status = PENDING).
          content:
            application/json:
              schema:
                type: object
                required: [fuelPurchaseId]
                properties:
                  fuelPurchaseId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/SemanticViolation' }

  /driver/fuel/correct:
    post:
      tags: [Fuel]
      summary: Driver correction of OCR-extracted values (A1.4). Sets driver_corrected.
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchase_id]
              properties:
                purchase_id: { type: string, format: uuid }
                corrected_amount: { type: number, exclusiveMinimum: 0 }
                corrected_liters: { type: number, exclusiveMinimum: 0 }
                corrected_date: { type: string, format: date }
                corrected_station: { type: string, maxLength: 255 }
                corrected_odometer: { type: integer, minimum: 0 }
      responses:
        '200': { description: Correction stored; the purchase is flagged for review. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/fuel/pending:
    get:
      tags: [Fuel]
      summary: Photo-first purchases awaiting verification, with the anomaly badge (2.7).
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Pending purchases. costPerKm is compared against app.fuel_efficiency_records (is_approximate = false).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, vehiclePlate, badges]
                  properties:
                    id: { type: string, format: uuid }
                    vehiclePlate: { type: string }
                    amount: { type: number, nullable: true }
                    liters: { type: number, nullable: true }
                    odometer: { type: integer, nullable: true }
                    distanceSinceLastRefuel: { type: number, nullable: true, description: Kilometres since the previous verified purchase for this vehicle. }
                    costPerKm: { type: number, nullable: true }
                    badges:
                      type: array
                      items: { type: string, enum: [AUTO, REVIEW, FLAGGED] }
                    ocr_raw_data: { type: object, nullable: true, description: app.fuel_purchases.ocr_raw. }
                    driver_corrected: { type: boolean }
                    confidence_score: { type: number, nullable: true, minimum: 0, maximum: 1 }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/fuel/verify/{id}:
    put:
      tags: [Fuel]
      summary: Verify, reject or adjust a photo-first purchase (2.5, C6.1).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [VERIFY, REJECT, CLEAR_PAYMENT] }
                adjusted_amount: { type: number, exclusiveMinimum: 0, description: Fleets Manager only (C6.1). }
                adjusted_liters: { type: number, exclusiveMinimum: 0, description: Fleets Manager only (C6.1). }
                adjusted_odometer: { type: integer, minimum: 0 }
                admin_notes: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Updated. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Hardware
  /admin/hardware/pair:
    post:
      tags: [Hardware]
      summary: Pair a tracker IMEI to a vehicle and mint the configuration SMS (A1.1).
      description: >-
        Registers the device in Traccar, stamps vehicles.tracker_paired_at and
        returns the SMS the installer must send to the tracker SIM. The server
        address in the command comes from system_config traccar.public_ip /
        traccar.h02_port (C2.4).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId, trackerImei]
              properties:
                vehicleId: { type: string, format: uuid }
                trackerImei: { type: string, pattern: '^[0-9]{15}$' }
                trackerBrand: { type: string, maxLength: 40, default: GENERIC_H02 }
                trackerSimNumber: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Paired.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, smsCommand, vehiclePlate]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  smsCommand: { type: string }
                  simNumber: { type: string, nullable: true }
                  vehiclePlate: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: IMEI already paired to another vehicle, or the vehicle already has a tracker.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  /admin/hardware/pending:
    get:
      tags: [Hardware]
      summary: Paired trackers and their first-contact / liveness state (N5).
      responses:
        '200':
          description: Tracker provisioning inbox.
          content:
            application/json:
              schema:
                type: object
                required: [trackers]
                properties:
                  trackers:
                    type: array
                    items:
                      type: object
                      required: [vehiclePlate, imei, status]
                      properties:
                        vehiclePlate: { type: string }
                        imei: { type: string }
                        brand: { type: string, nullable: true }
                        pairedAt: { type: string, format: date-time, nullable: true }
                        lastPing: { type: string, format: date-time, nullable: true }
                        status: { type: string, enum: [PENDING, ONLINE, OFFLINE, LOST] }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ Accidents
  /accidents/mayday:
    post:
      tags: [Accidents]
      summary: B17 escape hatch — submit GPS + flag, bypass all evidence (critical safety).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position, mayday_reason]
              properties:
                shift_id: { type: string, format: uuid, nullable: true, description: null when off-shift (C1.14). }
                vehicle_id: { type: string, format: uuid, nullable: true }
                position: { $ref: '#/components/schemas/GeoPoint' }
                mayday_reason: { type: string }
      responses:
        '201':
          description: Mayday recorded; full escalation fired.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accident_id: { type: string, format: uuid }
                  escalated_at: { type: string, format: date-time }

  /accidents:
    post:
      tags: [Accidents]
      summary: Create an accident report (3.1). Evidence may follow via PATCH.
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id]
              properties:
                shift_id: { type: string, format: uuid, nullable: true }
                vehicle_id: { type: string, format: uuid, nullable: true }
                trailer_id: { type: string, format: uuid, nullable: true }
                occurred_at: { type: string, format: date-time }
                position: { $ref: '#/components/schemas/GeoPoint' }
                driver_statement: { type: string }
                witness_name: { type: string }
                witness_phone: { type: string }
                third_party_plate: { type: string }
      responses:
        '201':
          description: Accident created.
          content:
            application/json:
              schema: { type: object, properties: { accident_id: { type: string, format: uuid } } }

  /accidents/{accidentId}/media:
    post:
      tags: [Accidents]
      summary: Attach a mandatory scene photo to an accident (3.1).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      parameters:
        - name: accidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot, media_object_id]
              properties:
                slot:
                  type: string
                  enum: [FRONT_DAMAGE, REAR_DAMAGE, SIDE_DAMAGE, OTHER_VEHICLE_PLATE, WITNESS, ADDITIONAL, POLICE_ABSTRACT, INSURANCE_DOCUMENT]
                media_object_id: { type: string, format: uuid }
      responses:
        '204': { description: Attached. }
        '422': { $ref: '#/components/responses/SemanticViolation' }

  /accidents/{accidentId}/telemetry/verify:
    get:
      tags: [Accidents]
      summary: Verify the SHA-256 hash chain of frozen telemetry (C3.4).
      parameters:
        - name: accidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Per-row verification result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  all_valid: { type: boolean }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        sequence: { type: integer }
                        is_valid: { type: boolean }

  # ------------------------------------------------------------------ Inspections
  /inspections:
    post:
      tags: [Inspections]
      summary: Submit a DVIR (1.1). Failing items require a photo (1.1).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id, template_id, subject, items, previous_defects_reviewed, signature_name]
              properties:
                shift_id: { type: string, format: uuid }
                template_id: { type: string, format: uuid }
                subject: { type: string, enum: [VEHICLE, TRAILER, TRAILER_SWAP] }
                vehicle_id: { type: string, format: uuid, nullable: true }
                trailer_id: { type: string, format: uuid, nullable: true }
                previous_defects_reviewed: { type: boolean }
                signature_name: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [template_item_id, result]
                    properties:
                      template_item_id: { type: string, format: uuid }
                      result: { type: string, enum: [PASS, FAIL, NOT_APPLICABLE] }
                      numeric_value: { type: number, description: Reefer temperature in Celsius (M6). }
                      notes: { type: string }
                      photo_media_object_id: { type: string, format: uuid }
      responses:
        '201':
          description: Inspection recorded.
          content:
            application/json:
              schema: { type: object, properties: { inspection_id: { type: string, format: uuid }, block_shift: { type: boolean } } }
        '422': { $ref: '#/components/responses/SemanticViolation' }

  # ------------------------------------------------------------------ Trailer
  /trailer/swap:
    post:
      tags: [Trailer]
      summary: Hook a new trailer / drop to bobtail (1.3, C1.12).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, hook_media_object_id, hook_inspection_id]
              properties:
                shift_id: { type: string, format: uuid }
                vehicle_id: { type: string, format: uuid }
                trailer_id: { type: string, format: uuid, nullable: true, description: null = bobtail (C1.12). }
                new_trailer_plate: { type: string, description: Driver-created external trailer (C1.11). }
                new_trailer_type: { type: string, enum: [DRY_VAN, REEFER, FLATBED, LOWBOY, TANKER, CURTAIN_SIDE, OTHER] }
                hook_media_object_id: { type: string, format: uuid }
                hook_inspection_id: { type: string, format: uuid }
                drop_media_object_id: { type: string, format: uuid, description: Present when dropping an existing trailer. }
      responses:
        '201':
          description: Assignment updated.
          content: { application/json: { schema: { type: object, properties: { trailer_assignment_id: { type: string, format: uuid } } } } }
        '422': { $ref: '#/components/responses/SemanticViolation' }

  # ------------------------------------------------------------------ Dashboard
  /dashboard/vehicle-states:
    get:
      tags: [Dashboard]
      summary: Live map marker states (N5). Streamed over WebSocket in prod; REST snapshot for polling.
      responses:
        '200':
          description: One entry per vehicle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicles:
                    type: array
                    items:
                      type: object
                      properties:
                        vehicle_id: { type: string, format: uuid }
                        display_state: { type: string, enum: [QUARANTINED, OFFLINE, HOS_ALERT, SPEEDING, MOVING, IDLING, PARKED] }
                        latitude: { type: number }
                        longitude: { type: number }
                        driver_name: { type: string, nullable: true }
                        next_eligible_clock_in_at: { type: string, format: date-time, nullable: true }

  # ------------------------------------------------------------------ Reconciliation
  /reconciliation/statements:
    post:
      tags: [Reconciliation]
      summary: Upload a fuel card statement CSV for matching (A1.9).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, period_start, period_end, media_object_id, column_mapping]
              properties:
                provider: { type: string }
                period_start: { type: string, format: date }
                period_end: { type: string, format: date }
                media_object_id: { type: string, format: uuid }
                column_mapping: { type: object, description: Maps CSV columns to date/amount/card_last_four/litres/station. }
      responses:
        '201':
          description: Import queued.
          content: { application/json: { schema: { type: object, properties: { statement_id: { type: string, format: uuid } } } } }

  # ------------------------------------------------------------------ Anomalies
  /anomalies:
    get:
      tags: [Anomalies]
      summary: Unified open-anomaly feed (fuel, HOS, accident, maintenance, security).
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: domains
          in: query
          schema: { type: array, items: { type: string, enum: [FUEL, HOS, ACCIDENT, MAINTENANCE, SECURITY] } }
      responses:
        '200':
          description: Page (see app.v_open_anomalies).
          content: { application/json: { schema: { $ref: '#/components/schemas/CursorPage' } } }

  # ------------------------------------------------------------------ Documents
  /documents/expiring:
    get:
      tags: [Documents]
      summary: Documents expiring within the configured window (3.5 / B8).
      parameters:
        - $ref: '#/components/parameters/cursor'
        - name: within_days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Page of expiring documents.
          content: { application/json: { schema: { $ref: '#/components/schemas/CursorPage' } } }

  # ------------------------------------------------------------------ Media
  /media/upload-url:
    post:
      tags: [Media]
      summary: Mint a 60-second pre-signed PUT URL (D5). Caller uploads then references media_object_id.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadRequest' }
      responses:
        '201':
          description: Upload ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUploadResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /telemetry/webhook:
    post:
      tags: [Dashboard]
      summary: Traccar position forwarder (A1.1). Consumed from the Redis Stream, not fire-and-forget HTTP (N2.3).
      security: []
      description: >-
        Public endpoint accepting a Traccar-decoded position. In production this
        is fronted by the telemetry gateway that writes to a durable Redis Stream
        and a back-fill poller reconciles gaps (decision N2.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, lat, lon, timestamp]
              properties:
                deviceId: { type: string, description: Traccar deviceId mapped to vehicles.traccar_device_id. }
                lat: { type: number }
                lon: { type: number }
                speed: { type: number }
                heading: { type: number }
                ignition: { type: boolean }
                timestamp: { type: string, format: date-time }
                attributes: { type: object, description: OBD values (M3) etc. }
      responses:
        '202': { description: Accepted into the ingestion stream. }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ------------------------------------------------------------------ Tenancy (14_tenancy.sql)
  /auth/signup:
    post:
      tags: [Tenancy]
      summary: Create a company and its first tenant-scoped ADMIN (self-service).
      description: >
        Unauthenticated and idempotent. Creates app.tenants (TRIAL/BASIC) with a slug derived from
        company_name, creates the user, and grants ADMIN inside that new tenant. The response is the
        standard session body plus the created tenant_id, so the client is signed in immediately.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Company created; session issued for its first ADMIN.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - type: object
                    properties:
                      tenant_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/accept-invite:
    post:
      tags: [Tenancy]
      summary: Accept an invitation, set a password, join the inviter's tenant.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '200':
          description: Session issued for the newly created member.
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/users/invite:
    post:
      tags: [Tenancy]
      summary: Invite a FLEET_MANAGER or ADMIN into the caller's tenant.
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteUserRequest' }
      responses:
        '201':
          description: Invitation created.
          content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/users:
    get:
      tags: [Tenancy]
      summary: Users of the caller's tenant with roles and assignment scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: role_code
          in: query
          schema: { type: string, enum: [DRIVER, DISPATCHER, FLEET_MANAGER, ADMIN, FINANCE, AUDITOR] }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, SUSPENDED] }
      responses:
        '200':
          description: Page of tenant users.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TenantUserSummary' } } } }

  /admin/invitations:
    get:
      tags: [Tenancy]
      summary: Pending invitations for the caller's tenant.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending invitations.
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Invitation' } } } } } }

  /admin/users/{userId}/roles/revoke:
    post:
      tags: [Tenancy]
      summary: Revoke a role from a user in the caller's tenant.
      security:
        - bearerAuth: []
        - idempotencyKey: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeRoleRequest' }
      responses:
        '204': { description: Role revoked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{userId}/assign:
    post:
      tags: [Tenancy]
      summary: Assign a manager to vehicles/drivers in the caller's tenant.
      security:
        - bearerAuth: []
        - idempotencyKey: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignScopeRequest' }
      responses:
        '204': { description: Scope updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------- Admin/manager roster + assignment
  # The surface the mobile AdminManagementScreen binds to. GET /admin/managers is a projection of
  # the GET /admin/users read model narrowed to ADMIN/FLEET_MANAGER; the POST is the same operation
  # as /admin/users/{userId}/assign, exposed under the path the client calls.
  /admin/managers:
    get:
      tags: [Tenancy]
      summary: Admins and fleet managers in the caller's tenant, with their assigned scope.
      description: >
        Tenant-scoped. An ADMIN or SYSTEM_ADMIN sees every manager in the company; a FLEET_MANAGER
        sees only themselves, mirroring the self-scoping the analytics surface already applies.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The admin/manager roster.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminRoster' } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/managers/{userId}/assign:
    post:
      tags: [Tenancy]
      summary: Replace one admin/manager's vehicle + driver scope.
      description: >
        Both arrays are REPLACE, not append. The target must belong to the caller's tenant; a
        cross-tenant target is rejected server-side (the mobile role gating is presentational only).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignAdminsRequest' }
      responses:
        '204': { description: Scope updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------- Vehicle master data (Pillar 4)
  /vehicles:
    get:
      tags: [Vehicles]
      summary: The caller's fleet (tenant-scoped, cursor-paged).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Page of vehicles.
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VehicleRecord' }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Vehicles]
      summary: Onboard a vehicle into the caller's tenant (A1.3).
      security:
        - bearerAuth: []
        - idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCreateRequest' }
      responses:
        '201':
          description: Vehicle created.
          content: { application/json: { schema: { $ref: '#/components/schemas/VehicleRecord' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /vehicles/{vehicleId}:
    get:
      tags: [Vehicles]
      summary: One vehicle in the caller's tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The vehicle.
          content: { application/json: { schema: { $ref: '#/components/schemas/VehicleRecord' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Vehicles]
      summary: Edit the vehicle columns the console owns.
      security:
        - bearerAuth: []
        - idempotencyKey: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleUpdateRequest' }
      responses:
        '200':
          description: The updated vehicle.
          content: { application/json: { schema: { $ref: '#/components/schemas/VehicleRecord' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles/{vehicleId}/assign:
    post:
      tags: [Vehicles]
      summary: Assign drivers and linked vehicles to one vehicle.
      description: >
        Drivers are written to app.assignments for the current operational date, so an assigned
        driver can actually clock in on the car (C1.8). Linked vehicles widen the scope of every
        manager already assigned to the target. Both arrays are REPLACE; every referenced id must
        belong to the caller's tenant.
      security:
        - bearerAuth: []
        - idempotencyKey: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignVehicleRequest' }
      responses:
        '204': { description: Assignment updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------- Scope-aware analytics (/analytics/*)
  # Every response is already narrowed to the caller's resolved scope: ADMIN sees the whole tenant,
  # FLEET_MANAGER only their app.manager_assignments slice, DRIVER only themselves. The same
  # operations are also mounted under /reports/* for the existing mobile ReportsScreen.
  /analytics/company:
    get:
      tags: [Analytics]
      summary: Company KPIs plus a per-manager breakdown.
      description: >
        Also served at GET /reports/analytics. The flat AnalyticsReport counters are included in the
        body, so the mobile AnalyticsReportSchema parses this response unchanged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/analyticsFrom'
        - $ref: '#/components/parameters/analyticsTo'
      responses:
        '200':
          description: Company roll-up scoped to the caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/CompanyAnalytics' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /analytics/manager/{userId}:
    get:
      tags: [Analytics]
      summary: One manager's KPIs, expanded per vehicle and per driver.
      description: Authorised for an ADMIN of the tenant, or for that manager themselves.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/analyticsFrom'
        - $ref: '#/components/parameters/analyticsTo'
      responses:
        '200':
          description: Manager analytics.
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagerAnalytics' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analytics/vehicle/{vehicleId}:
    get:
      tags: [Analytics]
      summary: Per-vehicle KPIs (tenant- and scope-checked).
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/analyticsFrom'
        - $ref: '#/components/parameters/analyticsTo'
      responses:
        '200':
          description: Vehicle analytics.
          content: { application/json: { schema: { $ref: '#/components/schemas/VehicleAnalyticsDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analytics/driver/{driverId}:
    get:
      tags: [Analytics]
      summary: Per-driver KPIs. Authorised for the driver, their manager, or an ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/analyticsFrom'
        - $ref: '#/components/parameters/analyticsTo'
      responses:
        '200':
          description: Driver analytics.
          content: { application/json: { schema: { $ref: '#/components/schemas/DriverAnalyticsDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analytics/me:
    get:
      tags: [Analytics]
      summary: The signed-in driver's own KPIs.
      description: >
        Returns DriverAnalyticsDetail for a DRIVER. A caller with no driver row (ADMIN, manager)
        receives the CompanyAnalytics view of their own scope instead.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/analyticsFrom'
        - $ref: '#/components/parameters/analyticsTo'
      responses:
        '200':
          description: The caller's own analytics.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DriverAnalyticsDetail'
                  - $ref: '#/components/schemas/CompanyAnalytics'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
